<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Application</title>
</head>

<body>

    <p align="center">
        <img src="https://mitmpllibportal.manipal.edu/sites/default/files/stacks_style_editor/img/logo/MANIPAL-INSTITUTE-OF-TECHNOLOGY.png"
             width="150"
             alt="MIT Logo">
    </p>

    <h1 align="center">MIT Manipal</h1>

    <marquee direction="right">Apply before 20 June !!</marquee>

    <p align="center">
        <img src="https://cf-images.assettype.com/thenewsminute/import/sites/default/files/Manipal_University_18122020_1200x800_%281%29.jpg?w=1200&h=675&auto=format%2Ccompress&fit=max&enlarge=true"
             alt="college"
             height="150"
             width="600">
    </p>

    <h2 align="center">Admission Application</h2>

    <table border="1" cellpadding="10" width="100%">
        <tr>
            <td width="50%" valign="top">

                <h2 align="center">Registration Form</h2>

                <form action="">

                    <table cellpadding="8" width="100%">

                        <tr>
                            <td>
                                <label for="firstname">First Name:</label>
                            </td>
                            <td>
                                <input type="text" name="firstname" id="firstname" required>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="lastname">Last Name:</label>
                            </td>
                            <td>
                                <input type="text" name="lastname" id="lastname" required>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="dob">Date of Birth:</label>
                            </td>
                            <td>
                                <input type="date" name="dob" id="dob" required>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="gender">Gender:</label>
                            </td>
                            <td>
                                <input type="radio" name="gender" value="Male"> Male
                                <input type="radio" name="gender" value="Female"> Female
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="blood">Blood Group:</label>
                            </td>
                            <td>
                                <select name="blood" id="blood">
                                    <option value="">Select</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                </select>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="email">Email:</label>
                            </td>
                            <td>
                                <input type="email" name="email" id="email" required>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="phone">Phone:</label>
                            </td>
                            <td>
                                <input type="tel" name="phone" id="phone" required>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="course">PG Course:</label>
                            </td>
                            <td>
                                <select name="course" id="course">
                                    <option value="">Select Course</option>
                                    <option value="MCA">MCA</option>
                                    <option value="MBA">MBA</option>
                                    <option value="MTech">M.Tech</option>
                                    <option value="MSc">M.Sc</option>
                                </select>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="address">Address:</label>
                            </td>
                            <td>
                                <textarea name="address" id="address" rows="4"></textarea>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2" align="center">
                                <input type="submit" value="Register">
                                <input type="reset" value="Reset">
                            </td>
                        </tr>

                    </table>

                </form>

            </td>

            <td width="50%" valign="top">

                <h2 align="center">Entrance Exam Registration</h2>

                <form action="">

                    <table cellpadding="8" width="100%">

                        <tr>
                            <td>
                                <label for="examname">Applicant Name:</label>
                            </td>
                            <td>
                                <input type="text" name="examname" id="examname" required>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="exam">Entrance Exam:</label>
                            </td>
                            <td>
                                <select name="exam" id="exam">
                                    <option value="">Select Exam</option>
                                    <option value="MET">MET</option>
                                    <option value="CAT">CAT</option>
                                    <option value="MAT">MAT</option>
                                    <option value="GATE">GATE</option>
                                </select>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="application">Application Number:</label>
                            </td>
                            <td>
                                <input type="text" name="application" id="application">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="examdate">Exam Date:</label>
                            </td>
                            <td>
                                <input type="date" name="examdate" id="examdate">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="examcenter">Exam Center:</label>
                            </td>
                            <td>
                                <select name="examcenter" id="examcenter">
                                    <option value="">Select Center</option>
                                    <option value="Manipal">Manipal</option>
                                    <option value="Bangalore">Bangalore</option>
                                    <option value="Mangalore">Mangalore</option>
                                    <option value="Mumbai">Mumbai</option>
                                    <option value="Chennai">Chennai</option>
                                </select>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="rank">Entrance Exam Rank:</label>
                            </td>
                            <td>
                                <input type="number" name="rank" id="rank">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="score">Entrance Exam Score:</label>
                            </td>
                            <td>
                                <input type="number" name="score" id="score">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="year">Exam Year:</label>
                            </td>
                            <td>
                                <input type="number" name="year" id="year" min="2020" max="2030">
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2" align="center">
                                <input type="submit" value="Apply for Entrance Exam">
                                <input type="reset" value="Reset">
                            </td>
                        </tr>

                    </table>

                </form>

            </td>
        </tr>
    </table>

</body>
</html>
