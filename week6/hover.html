<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .hover{
        height: 100px;
        width:100px;
        background-color: red;
        transition: 1.5s ease-in-out;
        margin-left: 10%;
        margin-top: 10%;
    }
    h1{
        text-align: center;
    }
    .hover:hover{
        transform: rotate(185deg) scale(1.5);
        
    }
</style>
<body>
    <div class="hover"><h1>Hover me</h1></div>
</body>
</html>
